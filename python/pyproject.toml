[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lossline"
version = "0.1.0"
description = "Experiment tracking with no server: runs are plain files in your own Hugging Face bucket."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["huggingface_hub>=1.5.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
lossline = "lossline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/lossline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hf: talks to the real Hugging Face Hub (needs a token and network)"]
addopts = "-m 'not hf'"

[project.urls]
Homepage = "https://bednarjosef.github.io/lossline/"
Source = "https://github.com/bednarjosef/lossline"
